[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainscene"
version = "0.0.1"
description = "3D scene change detection between phone recordings, with uncertainty for sim-to-real"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8", "plotly>=5.18",
       "pillow>=10"]
# Experiment dependencies are added per research path when first used (noted in RESEARCH.md).
# P1/P2 proof of concept (notebooks/scene01_change_heatmaps.ipynb); torch comes with Colab, and VGGT is
# installed from GitHub by the notebook.
poc = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8", "plotly>=5.18",
       "pillow>=10", "transformers>=4.45", "huggingface_hub>=0.23", "einops", "safetensors"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
