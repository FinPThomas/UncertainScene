[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainscene"
version = "0.0.1"
description = "3D scene change detection between phone recordings, with uncertainty for sim-to-real"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Experiment dependencies (torch, open3d, reconstruction models, ...) are added per research
# path when they are first used, with a note in RESEARCH.md.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
